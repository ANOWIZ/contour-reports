services:
  postgres:
    image: postgres:16-alpine
    container_name: product-reporting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_reporting
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: reporting_dev
    ports:
      - "5433:5432"
    volumes:
      - product-reporting-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting -d product_reporting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  product-reporting-data:
